<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejemplo css y bootstrap 5.3</title>
    <link href="https://cdn.jsdelivr.net/nmp/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container my-5">
        <div class="p-5 mb-4 bg-body-tertiary rounded-3 shadow-sm">
            <div class="container-fluid py-5">
                <h1 class="display-5 fw-bold text-primary">Registro vehicular</h1>
                <form>
                    <div class="mb-3">
                        <label for="txtNombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="txtNombre">
                    </div>
                    <div class="mb-3">
                        <label for="txtPlaca" class="form-label">Placa</label>
                        <input type="number" class="form-control" id="txtPlaca">
                    </div>
                    <div class="mb-3">
                        <label for="txtConductor" class="form-label">Conductor</label>
                        <input type="text" class="form-control" id="txtConductor">
                    </div>
                    <div class="mb-3">
                        <label for="txtDescripcion" class="form-label">Descripción</label>
                        <input type="text" class="form-control" id="txtDescripcion">
                    </div>
                </form>
                <table class="table table-striped table-hover"> 
                            <th scope="col">#</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Placa</th>
                            <th scope="col">Conductor</th>
                            <th scope="col">Descripción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                        </tr>
                    </tbody>
                </table>
                <button class="btn btn-dark btn-lg" type="button">Explorar</buttton>
            </div>
        </div>
    </div>
