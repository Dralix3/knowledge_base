<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="./bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="./icons/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <h1>Login</h1>
    <form>
  <div class="mb-3 row">
    <label for="txtUsuario" class="form-label" style="color: #df5320;">Usuario<br></label>
    <input type="text" class="form-control" id="txtUsuario">
    <span class="input-group-text" id="basic-addon1"><i class="bi bi-person-fill"></i></span>
  </div>
  <div class="mb-3">
    <label for="txtPassword" class="form-label" style="color: #df5320;">Password<br></label>
    <input type="password" class="form-control" id="txtPassword">
  </div>
  <br>
  <button type="submit" class="btn btn-primary" style="background-color: #2086df;">Entrar</button>
</form>
<div id="mensaje"></div>
<script src="./js/script.js"></script>  
</body>
</html>
