<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >   
</head>
<body class="bg-dark"> <!-- Fondo oscuro -->
    <main class="container-fluid"><!-- Contenedor fluido -->
        <div class="row min-vh-100 justify-content-center align-items-center"><!-- Fila responsiva -->
        <div class="col-11 col-sm-8 col-md-6 col-lg-4 col-xl-3"><!--columna responsiva-->

            <!--iniciar sesion-->
            <div class="card border-0 shadow-sm rounded-4"><!--sombreado-->
                
                <div class="card-body p-4 p-md-5"><!--padding-->

                    <h3 class="text-center mb-4">
                        Iniciar sesión <!--Encabezado-->
                    </h3>

                    <form action="login.php" method="POST">

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Nombre de usuario
                            </label>

                            <input
                                type="username"
                                id="username"
                                name="username"
                                class="form-control"
                                placeholder="Ingrese su nombre de usuario"
                            >

                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                placeholder="Ingrese su contraseña"
                            >

                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Iniciar sesión
                        </button>

                    </form>

                </div>

            </div>

        </div>

        </div>
    </main>
    
</body>
</html>
